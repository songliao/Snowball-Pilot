appId: com.snowball.pilot
productName: Snowball Pilot
# 使用纯 ASCII 版权声明：winCodeSign 2.6.0 的 rcedit 在 Win11 24H2 下
# 写入含 "©" 的 LegalCopyright 会报 "Unable to commit changes"，
# 因此这里用 (C) 代替 © 符号，确保版本资源能被正确写入。
copyright: Copyright (C) 2026 Snowball Pilot
directories:
  buildResources: resources
  output: dist
extraResources:
  - from: resources/icon.png
    to: icon.png
  # sql.js 运行时需要加载 wasm 文件，打包后 node_modules 已被排除，
  # 必须显式把 wasm 拷贝到 resources 目录供主进程 locateFile 加载
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
files:
  - out/**/*
  - "!node_modules/**/*"
  # sql.js 在主进程中被 external，运行时通过 require('sql.js') 加载，
  # 因此必须把它的源码保留进 asar 的 node_modules，否则打包后找不到模块
  - "node_modules/sql.js/**/*"
asar: true
# 签名前清除应用包内的扩展属性杂质（见 build/afterPack.js），
# 否则 codesign 在开启 hardened runtime 时会报
# "resource fork, Finder information, or similar detritus not allowed"。
afterPack: build/afterPack.js
mac:
  category: public.app-category.finance
  icon: resources/icon.icns
  # Developer ID 签名：留空则自动从钥匙串选取 "Developer ID Application" 证书。
  # 公证（notarization）由 electron-builder 在检测到以下环境变量时自动执行：
  #   APPLE_ID                 你的 Apple ID 邮箱
  #   APPLE_APP_SPECIFIC_PASSWORD   appleid.apple.com 生成的 App 专用密码
  #   APPLE_TEAM_ID             developer.apple.com 的 10 位 Team ID
  # 例如：APPLE_ID=me@icloud.com APPLE_APP_SPECIFIC_PASSWORD=abcd-efgh-ijkl-mnop APPLE_TEAM_ID=ABCDE12345 npm run dist:mac
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: resources/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
# 说明：在当前 Win11 24H2 环境下，electron-builder 生成的 NSIS 自解压安装包
# 启动时会出现「Not Responding / 无窗口」的兼容性问题（与 Defender 实时扫描
# Temp 目录中未签名自解压进程有关）。应用本体（win-unpacked）本身完全正常。
# 推荐交付方式：将 dist/win-unpacked 压缩为绿色版 zip 分发，用户解压到任意
# 普通目录双击 Snowball Pilot.exe 即可运行。安装包（setup.exe）在其他环境或
# 完成代码签名后可正常使用。
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Finance
  artifactName: ${productName}-${version}.${ext}
