# 官网（GitHub Pages）：部署 docs/ 静态站到 https://songliao.github.io/Snowball-Pilot/
# 需要在仓库 Settings → Pages 把 Source 设为 GitHub Actions（首次可由 API 自动配置）。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # upload-artifact 成功后，deploy-pages 立即查 artifact 偶发读不到（API 最终一致性）。
      # 轮询等到 artifact 在 API 可见再部署，避免 "No artifacts named github-pages" 假失败。
      - name: Wait for artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                --jq '.artifacts[].name' | grep -qx 'github-pages'; then
              echo "artifact github-pages is visible"
              exit 0
            fi
            echo "waiting for artifact ($i/12)..."
            sleep 5
          done
          echo "artifact github-pages did not become visible" >&2
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
