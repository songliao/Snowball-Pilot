# 官网（GitHub Pages）：部署 docs/ 静态站到 https://songliao.github.io/Snowball-Pilot/
# 需要在仓库 Settings → Pages 把 Source 设为 GitHub Actions（首次可由 API 自动配置）。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 上传与部署分属两个 job：同 job 内上传后立刻部署会撞上 GitHub 的
  # artifact 内部 API 延迟，deploy-pages 查不到刚上传的 github-pages（actions/deploy-pages#451）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
