name: Release

# 触发：推送 v* 标签（如 v1.0.0）或手动在 Actions 页面运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GITHUB_TOKEN 需要写权限以创建 Release
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package and publish to GitHub Releases
        # 使用 GitHub 自动注入的 GITHUB_TOKEN，无需任何个人 PAT
        run: npm run dist -- --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
