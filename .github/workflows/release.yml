name: Release

# 触发：推送 v* 标签（如 v1.0.10）或手动在 Actions 页面运行。
# 产物发布到 GitHub Releases；客户端 electron-updater 启动时读取 release 上的
# latest.yml / latest-mac.yml 判断是否有新版本，实现「推送即发布、用户端自动升级」。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，需与 package.json 版本一致，例如 v1.0.10'
        required: true

# GITHUB_TOKEN 需要写权限才能创建 Release 与上传产物
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验标签与 package.json 版本一致
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          # push tag 时用分支/标签名，手动触发时用输入框指定的标签
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_TAG"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          VERSION=$(node -p "require('./package.json').version")
          # electron-builder 发布时使用的 tag 固定为 v${package.json.version}，
          # 若二者不一致会另建一个 release，客户端将检测不到这次更新。
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::标签 $TAG 与 package.json 版本 $VERSION 不一致，应为 v$VERSION"
            exit 1
          fi
          echo "版本校验通过：$TAG"

      # 先建好 release（非 draft），后面两个构建任务各自往它上面追加产物，
      # 避免 mac / win 两个 job 并发创建同一个 release 时互相冲突。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 手动触发时标签可能尚未推送，这里补建后 --verify-tag 才能通过
          git tag "$TAG" 2>/dev/null && git push origin "$TAG" || true
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

  build-macos:
    needs: create-release
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 以下为可选的开发者 ID 签名 / 公证配置。未配置也能发布并被更新，
      # 但 macOS 首次打开会提示「身份不明的开发者」。
      CSC_KEYCHAIN_PASSWORD: ${{ secrets.CSC_KEYCHAIN_PASSWORD }}
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 导入签名证书（可选）
        if: env.APPLE_CERT_BASE64 != ''
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$CSC_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$CSC_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$CSC_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain"

      - name: Install dependencies
        run: npm ci

      # 只构建 dmg / zip。macOS 自动更新依赖 zip 产物（Squirrel.Mac），
      # 若同时产出 AppImage 之类无关目标会拖慢构建。
      - name: 构建并发布
        run: |
          npm run build
          npx electron-builder --mac --publish always

      - name: 清理钥匙串
        if: always() && env.APPLE_CERT_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true

  build-windows:
    needs: create-release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 产出 NSIS 安装包 + blockmap（增量差分）+ 绿色版 portable exe。
      # Windows 自动更新使用 NSIS 安装包，latest.yml 指向它。
      - name: 构建并发布
        run: |
          npm run build
          npx electron-builder --win --publish always
