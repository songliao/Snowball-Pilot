name: Release iOS

# iOS 端（OTC Pilot）发布：推送 ios-v* 标签（如 ios-v1.0.1）或手动运行。
# 不能用 v* —— 那是桌面端（Electron）发版标签，版本体系两边独立。
# 构建 → 云端自动签名（ASC API 密钥）→ altool 上传 TestFlight → ipa 存 artifact。
# API 密钥与仓库根目录其他 APPLE_* 密钥一样，是账户级的：与 Fintech-Library
# 仓库共用同一份 .p8 / Key ID / Issuer ID，各仓库各配一份同名 secrets 即可。
on:
  push:
    tags:
      - 'ios-v*'
  workflow_dispatch:
    inputs:
      marketing_version:
        description: '版本号（留空则用工程里的 MARKETING_VERSION）'
        required: false
        default: ''
      upload:
        description: '构建后上传 TestFlight'
        type: boolean
        default: true

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 App Store Connect API 密钥
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_P8" | base64 --decode > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8
        env:
          ASC_P8: ${{ secrets.ASC_P8 }}

      # 版本号：tag ios-v1.2.3 → CFBundleShortVersionString=1.2.3；
      # 构建号用时间戳，保证 TestFlight 单调递增（工程里当前为 1.0.0(6)）
      - name: 计算版本号
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            MARKETING="${GITHUB_REF_NAME#ios-v}"
          elif [ -n "$DISPATCH_VERSION" ]; then
            MARKETING="$DISPATCH_VERSION"
          else
            MARKETING=$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);.*/\1/p' \
              ios/SnowballPilot.xcodeproj/project.pbxproj | head -1)
          fi
          BUILD="$(date +%s)"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "版本 $MARKETING ($BUILD)"
        env:
          DISPATCH_VERSION: ${{ inputs.marketing_version }}

      - name: Archive（自动签名）
        working-directory: ios
        env:
          MARKETING: ${{ steps.ver.outputs.marketing }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          xcodebuild \
            -project SnowballPilot.xcodeproj \
            -scheme SnowballPilot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SnowballPilot.xcarchive \
            archive \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Export ipa
        working-directory: ios
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/SnowballPilot.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 上传 TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        working-directory: ios
        run: |
          xcrun altool --upload-app \
            -f build/*.ipa \
            --type ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: 保存 ipa 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SnowballPilot-${{ steps.ver.outputs.marketing }}-${{ steps.ver.outputs.build }}
          path: ios/build/*.ipa
          retention-days: 30
